function guideBoardMesh(lines,w,h,x,y,z,ry){
  const tex=canvasTex(1024,Math.round(1024*h/w),(g,cw,ch)=>{

    const pad=60,maxW=cw-pad*2;let yy=100;
    lines.forEach((t,i)=>{
      if(i<2){g.textAlign='center';g.font=i===0?'900 68px system-ui':'800 44px system-ui';g.fillStyle=i===0?'#ffd23f':'#fff';g.fillText(t,cw/2,yy);yy+=i===0?62:58;return}
      g.textAlign='left';g.font='600 28px system-ui';
      const ix=pad+34,words=t.split(' ');let line='',first=true;

      for(const wd of words){const tryL=line?line+' '+wd:wd;if(g.measureText(tryL).width>maxW-34&&line)flush(),line=wd;else line=tryL}

function makeBuilding(bx,bz,hx,hz,def){
  const w=Math.min(def.w||hx*2-8,hx*2-8),d=Math.min(def.d||hz*2-8,hz*2-8),h=def.h||8;
  const x0=bx-w/2,x1=bx+w/2,z0=bz-d/2,z1=bz+d/2,T=T_WALL,front=bz<0?1:-1;
  const col=def.color,Wint=w-2*T,Dint=d-2*T;

  const doorW=def.doorW||3.8,dx=bx+(def.doorX||0),dl=dx-doorW/2,dr=dx+doorW/2;
  const fz0=front>0?z1-T:z0,fz1=front>0?z1:z0+T,bz0=front>0?z0:z1-T,bz1=front>0?z0+T:z1;
  const W={k:'wall'};
  solid(x0,0,bz0,x1,HG,bz1,col,W);
  solid(x0,0,z0,x0+T,HG,z1,col,W);solid(x1-T,0,z0,x1,HG,z1,col,W);
  solid(x0,0,fz0,dl,HG,fz1,col,W);solid(dr,0,fz0,x1,HG,fz1,col,W);solid(dl,DOORH,fz0,dr,HG,fz1,col,W);
  solid(x0,HG,z0,x1,HG+.4,z1,0xe9e2d6,W);                     // ceiling slab
  if(h>HG+.9)solid(x0,HG+.4,z0,x1,h,z1,col,W);                // upper floors (solid)
  solid(x0-.15,h,z0-.15,x1+.15,h+.4,z1+.15,0x4c4a58);         // roof cap
  solid(x0+T,0,z0+T,x1-T,.08,z1-T,def.floor||0xd8c7a8,{col:false}); // floor
  // door frame glow strip + sign
  solid(dl-.25,0,fz0-(front>0?0:.05),dl,DOORH,fz1+(front>0?.05:0),0x2b2540,{col:false});
  solid(dr,0,fz0-(front>0?0:.05),dr+.25,DOORH,fz1+(front>0?.05:0),0x2b2540,{col:false});
  const outZ=front>0?z1:z0;
  const sg=signMesh(def.name,Math.min(w-2,10),1.7,dx,Math.min(h-1.6,6.6),outZ+front*.05,front>0?0:PI,def.signBg||'#241a33',def.signFg||'#ffd23f');

  }
  // rooftop clutter
  if(h>9){solid(bx+w*.15,h+.4,bz-d*.15,bx+w*.15+2.2,h+2.2,bz-d*.15+2.2,0x8a5a3a);}
  const b={name:def.name,type:def.type,x0:x0+T,x1:x1-T,z0:z0+T,z1:z1-T,ox0:x0,ox1:x1,oz0:z0,oz1:z1,h,front,dx,doorW,
    doorOut:V(dx,0,outZ+front*3.2),doorIn:V(dx,0,outZ-front*3.2),faceYaw:front>0?PI:0,bx,bz,w,d};
  BLD.push(b);
  // interior helpers
  const Wp=(u,v)=>({x:bx+u,z:front>0?z1-T-v:z0+T+v});
  const prop=(u,v,wd,dp,hh,color,y0=0,o={})=>{const p=Wp(u,v);solid(p.x-wd/2,y0,p.z-dp/2,p.x+wd/2,y0+hh,p.z+dp/2,color,o)};
  const lights=(n)=>{for(let i=0;i<n;i++){const v=Dint*(i+.5)/n,p=Wp(0,v);solid(p.x-2.2,HG-.1,p.z-.25,p.x+2.2,HG,p.z+.25,0xfff1b0,{col:false,k:'glow'})}};
  const npc=(kind,u,v,o={})=>{const p=Wp(u,v);NPC_SPECS.push(Object.assign({kind,x:p.x,z:p.z,yaw:front>0?PI:0,bld:b},o))};
  const shelves=(vFrom,vTo)=>{
    for(const s of[-1,1]){
      const u=s*(Wint/2-1.5),len=vTo-vFrom,vm=(vFrom+vTo)/2;
      prop(u,vm,1.1,len,2.3,0x9b7b5a);
      const p=Wp(u-s*.56,vm);
      for(let k=0;k<3;k++)for(let m=0;m<5;m++){const zz=p.z-len/2+(m+.5)*len/5;
        solid(p.x-s*.02-.05,.45+k*.7,zz-len/10+.1,p.x+.05-s*.02,.85+k*.7,zz+len/10-.1,[0xe8554a,0xf2c94c,0x4bbf6b,0x4b8be8,0xc76be8][(k*5+m)%5],{col:false})}

      const rp=Wp(4.5,cv);solid(rp.x-.35,1.17,rp.z-.3,rp.x+.35,1.5,rp.z+.3,0x9aa0ab,{col:false});
      TOUCH.push({kind:'reg',pos:V(rp.x,1.45,rp.z),r:.6,value:300,cd:0,prog:0,bld:b});
      npc('clerk',0,cv+2.3,{hat:'money',hc:0x1f8a3b,fur:0x2ecc71,up:true,role:'clerk'});

function drawMap(){
  const g=PH.c.getContext('2d'),S=256/292,X=x=>(x+146)*S,Z=z=>(z+146)*S;
  g.fillStyle='#2a2540';g.fillRect(0,0,256,256);g.fillStyle='#4b4566';
  for(const r of ROADS){g.fillRect(X(r)-4*S,0,8*S,256);g.fillRect(0,Z(r)-4*S,256,8*S)}
  const col={bank:'#3ddc84',armory:'#ff9a3c',jobs:'#ffd23f',police:'#4b8be8',hide:'#9aa0b5',shop:'#f08cb4'};
  for(const b of BLD){g.fillStyle=col[b.type]||'#6b6488';g.fillRect(X(b.ox0),Z(b.oz0),(b.ox1-b.ox0)*S,(b.oz1-b.oz0)*S)}
  g.font='700 11px system-ui';g.textAlign='center';g.fillStyle='#fff';
  for(const b of BLD)if(['bank','armory','jobs','police','hide'].includes(b.type))g.fillText(b.name.split(' ')[0],X(b.bx),Z(b.bz)+4);
  for(const c of cars){g.fillStyle=c.bar?'#2d6bff':'#fff';g.fillRect(X(c.group.position.x)-2,Z(c.group.position.z)-2,4,4)}
  for(const ch of CHARS)if(ch.kind==='cop'&&ch.role==='chase'&&!ch.dead){g.fillStyle='#ff3b3b';g.beginPath();g.arc(X(ch.x),Z(ch.z),3,0,7);g.fill()}
  if(G.job){const d=G.job.dest.doorOut;g.strokeStyle='#40e0ff';g.lineWidth=3;g.beginPath();g.arc(X(d.x),Z(d.z),7+Math.sin(performance.now()/200)*2,0,7);g.stroke()}
  const px=X(P.pos.x),pz=Z(P.pos.z);g.fillStyle='#ffd23f';g.strokeStyle='#000';g.lineWidth=2;
  g.save();g.translate(px,pz);g.rotate(-vrYaw);g.beginPath();g.moveTo(0,-9);g.lineTo(6,6);g.lineTo(-6,6);g.closePath();g.fill();g.stroke();g.restore();
  PH.t.needsUpdate=true;
}
function makePhoneMesh(){
  if(!PH.c){PH.c=document.createElement('canvas');PH.c.width=PH.c.height=256;PH.t=new THREE.CanvasTexture(PH.c);drawMap()}
  const gr=new THREE.Group();
  gr.add(new THREE.Mesh(new THREE.BoxGeometry(.11,.19,.012),new THREE.MeshStandardMaterial({color:0x15151c})));
  const sc=new THREE.Mesh(new THREE.PlaneGeometry(.095,.095),new THREE.MeshBasicMaterial({map:PH.t}));sc.position.set(0,.025,.007);gr.add(sc);
  gr.userData.phone=true;return gr;
}
function phoneStep(now){
  if(!PH.c||now-PH.last<250)return;
  if(HELD.includes('phone')||BP.open>=0){PH.last=now;drawMap()}
}

// ---- courier jobs (Hustle Hub) ----
const _jb=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,40,12,1,true),new THREE.MeshBasicMaterial({color:0x40e0ff,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}));_jb.visible=false;scene.add(_jb);
function startJob(){
  const c=BLD.filter(b=>b!==JOBHUB&&b.doorOut&&Math.hypot(b.doorOut.x-P.pos.x,b.doorOut.z-P.pos.z)>70);if(!c.length)return;
  const d=c[(rnd()*c.length)|0],dist=Math.hypot(d.doorOut.x-P.pos.x,d.doorOut.z-P.pos.z);
  G.job={dest:d,t:Math.round(dist/3.2+25),pay:Math.round(60+dist*1.2)};_jb.position.set(d.doorOut.x,20,d.doorOut.z);_jb.visible=true;
  toast('Deliver to '+d.name+' for $'+G.job.pay,'#7dffa0');sfx.click()}
function endJob(ok,msg){
  if(!G.job)return;if(ok){SAVE.cash+=G.job.pay;sfx.coin();toast('Delivered! +$'+G.job.pay,'#7dffa0')}else toast(msg||'Run failed','#ff6b6b');
  G.job=null;_jb.visible=false}
function jobTick(dt){
  if(!G.job)return;G.job.t-=dt;const d=G.job.dest.doorOut;
  if(Math.hypot(d.x-P.pos.x,d.z-P.pos.z)<5)endJob(true);else if(G.job.t<=0)endJob(false,'Out of time!');
}

// ---- wrist HUD ----
const hud=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const t=new THREE.CanvasTexture(c);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(.1,.05),new THREE.MeshBasicMaterial({map:t,transparent:true}));
  m.scale.setScalar(1.3);m.material.side=THREE.DoubleSide;m.position.set(-.06,0,.04);m.rotation.set(0,-Math.PI/2,0);grips[0].add(m);return{c,t,m,last:''}})();
function drawHud(){
  const s=`${SAVE.cash}|${Math.ceil(G.heat)}|${SET.joy}|${SET.turn}|${G.job?Math.ceil(G.job.t):0}`;if(s===hud.last)return;hud.last=s;
  const g=hud.c.getContext('2d');g.clearRect(0,0,256,128);g.fillStyle='rgba(28,20,48,.85)';rrect(g,2,2,252,124,16);g.fill();
  g.fillStyle='#ffd23f';g.font='900 44px system-ui';g.textAlign='center';g.fillText('$'+SAVE.cash,128,46);
  g.fillStyle='#ff5a5a';g.font='900 30px system-ui';g.fillText(G.heat>0?'★'.repeat(Math.ceil(G.heat)):'no heat',128,82);
  g.font='700 18px system-ui';g.fillStyle='#b9b2d6';g.fillText(G.job?'RUN > '+G.job.dest.name.slice(0,16)+' '+Math.ceil(G.job.t)+'s':'JOY '+(SET.joy?'ON':'OFF')+'  ·  A: car',128,112);hud.t.needsUpdate=true;
}
// ---- save ----
let saveT=0;function persist(){try{localStorage.setItem('ruckus2save',JSON.stringify(SAVE))}catch(e){}}
// ---- respawn / session ----
function respawn(){
  if(car)exitCar();
  rig.updateMatrixWorld(true);const xc=renderer.xr.getCamera();const H=rig.localToWorld(V().copy(xc.position));
  rig.position.x+=SPAWN.x-H.x;rig.position.z+=SPAWN.z-H.z;rig.updateMatrixWorld(true);vrInit=true;vel0();
  toast('Respawned','#7de8ff');
}
renderer.xr.addEventListener('sessionstart',()=>{rigScaleTarget=VS;rig.scale.setScalar(VS);rig.rotation.set(0,0,0);rig.position.set(SPAWN.x,0,SPAWN.z);rig.updateMatrixWorld(true);vrInit=true;vrPrev[0]=vrPrev[1]=null;vel0();audio();toast('Welcome to Ruckus City','#ffd23f');toast('Buy the blaster at Boom Town Armory','#fff')});
renderer.xr.addEventListener('sessionend',()=>{if(car)exitCar();rig.scale.setScalar(1);rig.position.set(0,0,0);rig.rotation.set(0,0,0);cam.position.set(0,0,0)});
// ---- touch interactions ----
let lastHint=0;const now2=()=>performance.now();
function touchStep(dt){
  for(const t of TOUCH){
    if(t.cd>0)t.cd-=dt;
    if(t.kind==='bag'||t.kind==='stack'){
      if(!t.active){t.timer-=dt;if(t.timer<=0){t.active=true;t.mesh.visible=true}continue}
      t.mesh.position.y=t.y+Math.sin(performance.now()/500+t.phase)*.04;t.mesh.rotation.y+=dt;
      for(let k=0;k<2;k++)if(HWok[k]&&HW[k].distanceTo(t.pos)<t.r+.25){
        const v=Math.round(t.value*(1+.25*SAVE.bags));SAVE.cash+=v;t.active=false;t.mesh.visible=false;t.timer=45;
        pop('+$'+v,t.pos,'#7dffa0');sfx.coin();addHeat(.4);pulse(k,.5,60);break}
    }else if(t.kind==='reg'){
      if(t.cd>0)continue;
      let work=false,near=false;
      for(let k=0;k<2;k++)if(HWok[k]&&HW[k].distanceTo(t.pos)<t.r+.3){near=true;if(HELD[k]==='lockpick')work=true}
      if(work){t.prog+=dt;if(((t.prog*8)|0)!==(((t.prog-dt)*8)|0)){sfx.pick();pulse(1,.3,20)}
        if(t.prog>=2){t.prog=0;t.cd=120;popCash(t.pos,t.value);addHeat(1);sfx.alarm();toast('REGISTER OPEN!','#7dffa0')}}
      else{t.prog=Math.max(0,t.prog-dt);if(near&&(trigEdge(0)||trigEdge(1))&&now2()-lastHint>3000){lastHint=now2();toast(SAVE.lockpick?'Equip the LOCKPICK and hold it on the register':'Locked! Buy a lockpick at the Armory','#ffd23f')}}
    }else if(t.kind==='job'||t.kind==='jobcancel'){
      for(let k=0;k<2;k++)if(HWok[k]&&t.cd<=0&&HW[k].distanceTo(t.pos)<t.r+.2&&trigEdge(k)){
        t.cd=60;pulse(k,.5,60);
        if(t.kind==='jobcancel'){endJob(false,'Run cancelled');break}
        if(G.job){toast('Finish your run first','#ffd23f');break}
        startJob();break}
    }else if(t.kind==='pad'){
      for(let k=0;k<2;k++)if(HWok[k]&&HW[k].distanceTo(t.pos)<t.r+.2&&trigEdge(k)){buyPad(t.pad.key);pulse(k,.5,60)}
    }
  }
}
// ---- bullets ----
function bulletStep(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i],step=b.v.length()*dt;b.life-=dt;let dead=b.life<=0;
    if(!dead&&charHit(b))dead=true;
    if(!dead){colRay.set(b.m.position,_fd.copy(b.v).normalize());colRay.far=step+.1;
      if(colRay.intersectObject(colMesh,false).length){dead=true;sfx.thud&&sfx.thud()}}
    b.m.position.addScaledVector(b.v,dt);
    if(dead){scene.remove(b.m);bullets.splice(i,1)}
  }
}
// ---- main loop ----
let last=performance.now(),menuPrev=false;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    const vr=renderer.xr.isPresenting;
    if(vr){
      readInput();
      const gp=byHand[0]&&byHand[0].gp;
      const mb=!!(gp&&gp.buttons.slice(6).some(b=>b&&b.pressed));
      if((mb&&!menuPrev)||(INP[0].st&&!INP[0].stP)){SET.joy=!SET.joy;toast(SET.joy?'JOYSTICK MOVEMENT ON':'ARM MOVEMENT ONLY',SET.joy?'#7dffa0':'#b9b2d6');sfx.click()}
      menuPrev=mb;
      if(car)stepCarVR(dt);else{
        stepVR(dt);
        if(INP[1].a&&!INP[1].aP){let best=null,bd=4.5;for(const c of cars){const d=c.group.position.distanceTo(P.pos);if(d<bd){bd=d;best=c}}if(best)enterCar(best)}
        for(let k=0;k<2;k++)if(HELD[k]==='gun'&&trigEdge(k)&&fireCD<=0)fireGun(k);
      }
      if(car)for(let k=0;k<2;k++){/* cars: triggers are gas/brake */}
      fireCD-=dt;touchStep(dt);bulletStep(dt);charsStep(dt);jobTick(dt);dropsStep(dt);phoneStep(now);drawHud();
    }else{
      cam.position.set(Math.sin(now/9000)*40+25,14,Math.cos(now/9000)*40+25);cam.lookAt(25,0,25);
    }
    for(let i=toasts.length-1;i>=0;i--){const t=toasts[i];t.t+=dt;if(t.t>2.4){cam.remove(t.s);toasts.splice(i,1)}else t.s.material.opacity=Math.min(1,(2.4-t.t)*2)}
    for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;p.s.position.y+=dt*.8;if(p.t>1.5){scene.remove(p.s);pops.splice(i,1)}else p.s.material.opacity=Math.min(1,(1.5-p.t)*2)}
    saveT+=dt;if(saveT>5){saveT=0;persist()}
  }catch(e){console.error(e)}
  renderer.render(scene,cam);
}
renderer.setAnimationLoop(frame);
const _m=$('msg');if(_m)_m.style.display='none';
